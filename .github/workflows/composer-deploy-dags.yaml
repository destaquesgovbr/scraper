# Deploy das DAGs do scraper no Airflow
# Em push na main, publica dags/ em gs://<bucket>/dags/scraper/ em cada bucket da lista padrão
# da reusable workflow (v3): na Fase 3 da migração do Composer, o bucket do Cloud Composer e o
# do Airflow próprio (infra/_plan/migrar-composer-para-airflow-proprio.md). Quando o Composer
# for desligado, a lista muda na reusable workflow; este arquivo não muda.

name: Deploy Scraper DAGs to Airflow

on:
  push:
    branches:
      - main
    paths:
      - 'dags/**'
      - '.github/workflows/composer-deploy-dags.yaml'
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  deploy:
    uses: destaquesgovbr/reusable-workflows/.github/workflows/airflow-deploy-dags.yml@v3
    with:
      dags_local_path: dags
      dags_bucket_subdir: scraper
