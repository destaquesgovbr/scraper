name: Tests

on:
  pull_request:
    branches: [ "main" ]
    paths:
      - 'src/**'
      - 'tests/**'
      - 'pyproject.toml'
      - 'dags/**'
      - '.github/workflows/tests.yaml'
  workflow_dispatch:

jobs:
  test:
    name: Run Tests
    runs-on: ubuntu-latest

    # Postgres descartável (pgvector) para os testes `postgres`: provam contra um
    # banco real que o re-scrape preserva resumo, temas, embedding e thumbnail e só
    # republica o que deve. Porta 55432: a guarda recusa 5432 (Cloud SQL Proxy).
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Poetry
        run: |
          curl -sSL https://install.python-poetry.org | python3 -
          echo "$HOME/.local/bin" >> $GITHUB_PATH

      - name: Cache Poetry dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pypoetry
          key: ${{ runner.os }}-poetry-${{ hashFiles('poetry.lock') }}
          restore-keys: |
            ${{ runner.os }}-poetry-

      - name: Install dependencies
        run: poetry install --no-interaction

      - name: Run tests
        run: poetry run pytest -m "not integration"

      - name: Run Postgres tests (pgvector descartável)
        env:
          SCRAPER_TEST_POSTGRES_URL: postgresql://postgres@127.0.0.1:55432/postgres
        run: poetry run pytest -m postgres --no-cov -rs
