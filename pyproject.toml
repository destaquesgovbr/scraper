[tool.poetry]
name = "govbr-scraper"
version = "1.0.0"
description = "Gov.br and EBC news scraper for DestaquesGovBr"
authors = ["Nitai Bezerra <nitai@example.com>"]
readme = "README.md"
packages = [{include = "govbr_scraper", from = "src"}]

[tool.poetry.dependencies]
python = "^3.12"

# Database
psycopg2-binary = "^2.9.9"
sqlalchemy = "^2.0.23"

# API (Cloud Run scraper service)
fastapi = "^0.115.0"
uvicorn = {version = "^0.34.0", extras = ["standard"]}

# Web scraping
beautifulsoup4 = "^4.12.3"
requests = "^2.32.3"
retry = "^0.9.2"
markdownify = "^0.14.1"

# EBC smart_sleep
numpy = ">=1.26.0"
scipy = "^1.11.0"

# Configuration
pydantic = "^2.5.3"
pydantic-settings = "^2.1.0"
pyyaml = "^6.0.2"

# Event publishing (Pub/Sub)
google-cloud-pubsub = "^2.23.0"

# Utilities
loguru = "^0.7.2"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.3"
pytest-cov = "^4.1.0"
ruff = "0.14.10"
httpx = ">=0.24.0"
pre-commit = "^4.5.1"
mypy = "1.19.1"
bandit = "1.9.4"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
]
ignore = [
    "E501",  # line too long (handled by Ruff formatter)
    "B008",  # do not perform function calls in argument defaults
]

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
"dags/**/*.py" = ["E402"]      # Late imports in Airflow DAGs
"tests/**/*.py" = ["S101", "B017", "F841", "B007"]     # Allow asserts, blind exceptions, unused vars in tests
"src/govbr_scraper/storage/storage_adapter.py" = ["E722"]  # Bare except for defensive handling
"src/govbr_scraper/scrapers/webscraper.py" = ["B023", "B007"]  # Lambda captures in scraping logic
"src/govbr_scraper/scrapers/ebc_webscraper.py" = ["B023", "B904", "E722"]  # Lambda captures, exception handling, bare except
"src/govbr_scraper/scrapers/plone6_api_scraper.py" = ["F841", "B007"]  # Unused vars in parsing logic
"src/govbr_scraper/scrapers/yaml_config.py" = ["F841"]  # Unused vars in parsing
"src/govbr_scraper/api.py" = ["B904"]  # Raise without from in FastAPI handlers

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = [
    "--verbose",
    "--cov=govbr_scraper",
    "--cov-report=term-missing",
]
markers = [
    "integration: tests that make real HTTP requests to external services",
]

[tool.mypy]
python_version = "3.12"
warn_return_any = false
warn_unused_configs = true
disallow_untyped_defs = false
disallow_incomplete_defs = false
check_untyped_defs = false
no_implicit_optional = false
warn_redundant_casts = true
warn_unused_ignores = true
ignore_missing_imports = true
no_strict_optional = true

# Core modules with type checking enabled (start small, expand later)
[[tool.mypy.overrides]]
module = [
    "govbr_scraper.models",
    "govbr_scraper.models.*",
]
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
